# PPO Training Configuration — Experiment 28 (MLP, stage mix 1-10)
#
# Warm-start: Exp27 best_eval.pt (s1_best=8.6, s1_avg=6.99)
#
# Same move as Exp19→Exp20: expand stage mix from 1-6 to 1-10.
# Exp19→Exp20 took s1_best 7.4 → 10.1. With stronger Exp27 foundation
# (8.6 vs 7.4), expect to push past 10.1 and toward 12+.
#
# Back to proven MLP architecture — transformer was unsuitable because
# our observation frames are hand-crafted float tuples with no hidden
# structure for attention to discover. MLP handles this optimally.

total_timesteps: 25000000
max_episode_steps: 100000

learning_rate: 0.00003
learning_rate_end: 0.0000005
anneal_lr: true
gamma: 0.99
gae_lambda: 0.98
clip_epsilon: 0.2
value_coef: 0.10
entropy_coef: 0.002
entropy_coef_end: 0.0002
anneal_entropy: true
max_grad_norm: 0.5
normalize_returns: false

rollout_steps: 4096
num_epochs: 8
batch_size: 64

network_arch: mlp
hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true
shared_backbone: false

normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 30

# Full proven reward stack
reward_crash_penalty: 600.0
reward_crash_penalty_stage_scale: 0.4
reward_fuel_exhaustion_penalty: 600.0
reward_low_fuel_penalty: 2.0
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_speed_scale: 0.5
reward_fuel_bonus: 45.0
reward_pothole_penalty: 8.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08
reward_bonus_stage_scale: 0.3

randomize_seed: true
seed_range: 1000

# Expanded to stages 1-10 (same move as Exp19→Exp20)
stage_mix:
  1:  0.35
  2:  0.15
  3:  0.12
  4:  0.10
  5:  0.09
  6:  0.08
  7:  0.05
  8:  0.03
  9:  0.02
  10: 0.01

curriculum_enabled: false
early_stopping_patience: 0

eval_interval_updates: 25
eval_episodes: 10
eval_start_stages:
  - 1
  - 5
  - 8
eval_deterministic: true
eval_max_episode_steps: 100000

log_interval: 1
save_interval: 25
checkpoint_dir: rl/ppo/checkpoints

env_fps: 60
device: cpu
