# PPO Training Configuration — Experiment 27
#
# Warm-start from Exp26 (max_objects=30, s1_best=7.0, s1_avg=5.63)
#
# Exp26 built a strong fresh foundation with full situational awareness (max_objects=30)
# and full-speed incentive (speed_scale=0.5). Now expand stage mix to stages 1-6,
# same graduated expansion that took Exp18 (avg 3.52) → Exp19 (avg 6.03).
# With a stronger foundation, expect to push past 8.0 avg.

total_timesteps: 20000000
max_episode_steps: 100000

learning_rate: 0.0001
learning_rate_end: 0.000002
anneal_lr: true
gamma: 0.99
gae_lambda: 0.98
clip_epsilon: 0.2
value_coef: 0.15
entropy_coef: 0.005
entropy_coef_end: 0.0005
anneal_entropy: true
max_grad_norm: 0.5
normalize_returns: false

rollout_steps: 4096
num_epochs: 8
batch_size: 64

hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true
shared_backbone: false

normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 30

# Full reward stack — identical to Exp26
reward_crash_penalty: 600.0
reward_crash_penalty_stage_scale: 0.4
reward_fuel_exhaustion_penalty: 600.0
reward_low_fuel_penalty: 2.0
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_pothole_penalty: 8.0
reward_fuel_bonus: 45.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08
reward_bonus_stage_scale: 0.3
reward_speed_scale: 0.5   # full-speed incentive — keep from Exp26

randomize_seed: true
seed_range: 1000

# Graduated expansion from Exp26's {1:0.70, 2:0.20, 3:0.10}
stage_mix:
  1:  0.45
  2:  0.20
  3:  0.15
  4:  0.10
  5:  0.07
  6:  0.03

curriculum_enabled: false
early_stopping_patience: 0

eval_interval_updates: 25
eval_episodes: 10
eval_start_stages:
  - 1
  - 3
  - 5
eval_deterministic: true
eval_max_episode_steps: 100000

log_interval: 1
save_interval: 25
checkpoint_dir: rl/ppo/checkpoints

env_fps: 60
device: cpu
