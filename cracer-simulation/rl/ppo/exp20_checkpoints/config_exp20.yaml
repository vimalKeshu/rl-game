# Experiment 20 — "Expand Stage Mix to 1-10"
# Warm-start: Exp19 best_eval.pt (s1_best=7.4, s1_avg=6.03)
# Results: s1_best=10.1, s1_avg=8.46

total_timesteps: 25000000
max_episode_steps: 100000

learning_rate: 0.00005
learning_rate_end: 0.000001
anneal_lr: true
gamma: 0.99
gae_lambda: 0.98
clip_epsilon: 0.2
value_coef: 0.10
entropy_coef: 0.003
entropy_coef_end: 0.0003
anneal_entropy: true
max_grad_norm: 0.5
normalize_returns: false

rollout_steps: 4096
num_epochs: 8
batch_size: 64

hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true
shared_backbone: false

normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 10

reward_crash_penalty: 600.0
reward_crash_penalty_stage_scale: 0.4
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_speed_scale: 0.1
reward_fuel_bonus: 45.0
reward_pothole_penalty: 8.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08

randomize_seed: true
seed_range: 1000

stage_mix:
  1:  0.35
  2:  0.15
  3:  0.12
  4:  0.10
  5:  0.09
  6:  0.08
  7:  0.05
  8:  0.03
  9:  0.02
  10: 0.01

curriculum_enabled: false
early_stopping_patience: 0

eval_interval_updates: 25
eval_episodes: 10
eval_start_stages:
  - 1
  - 5
  - 8
eval_deterministic: true
eval_max_episode_steps: 100000

log_interval: 1
save_interval: 25
checkpoint_dir: rl/ppo/checkpoints

env_fps: 60
device: cpu
