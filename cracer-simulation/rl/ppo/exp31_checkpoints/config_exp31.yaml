# PPO Training Configuration — Experiment 31
#
# Warm-start: Exp30 best_eval.pt (s1_best=12.3, new all-time record)
#
# Expand stage mix from 1-20 to 1-25.
# Agent now reaches stage 12+ from cold start — direct training on
# stages 21-25 gives practice on territory it's already reaching.

total_timesteps: 25000000
max_episode_steps: 100000

learning_rate: 0.00001
learning_rate_end: 0.0000001
anneal_lr: true
gamma: 0.99
gae_lambda: 0.98
clip_epsilon: 0.2
value_coef: 0.10
entropy_coef: 0.001
entropy_coef_end: 0.0001
anneal_entropy: true
max_grad_norm: 0.5
normalize_returns: false

rollout_steps: 4096
num_epochs: 8
batch_size: 64

network_arch: mlp
hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true
shared_backbone: false

normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 30

# Full proven reward stack
reward_crash_penalty: 600.0
reward_crash_penalty_stage_scale: 0.4
reward_fuel_exhaustion_penalty: 600.0
reward_low_fuel_penalty: 2.0
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_speed_scale: 0.5
reward_fuel_bonus: 45.0
reward_pothole_penalty: 8.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08
reward_bonus_stage_scale: 0.3

randomize_seed: true
seed_range: 1000

# Expanded to stages 1-25
stage_mix:
  1:  0.18
  2:  0.09
  3:  0.07
  4:  0.06
  5:  0.06
  6:  0.05
  7:  0.05
  8:  0.05
  9:  0.04
  10: 0.04
  11: 0.04
  12: 0.03
  13: 0.03
  14: 0.03
  15: 0.03
  16: 0.02
  17: 0.02
  18: 0.02
  19: 0.02
  20: 0.02
  21: 0.01
  22: 0.01
  23: 0.01
  24: 0.01
  25: 0.01

curriculum_enabled: false
early_stopping_patience: 0

eval_interval_updates: 25
eval_episodes: 10
eval_start_stages:
  - 1
  - 5
  - 10
eval_deterministic: true
eval_max_episode_steps: 100000

log_interval: 1
save_interval: 25
checkpoint_dir: rl/ppo/checkpoints

env_fps: 60
device: cpu
