# PPO Specialist Training — High-Stage Expert (Phases 1 of 2)
#
# Warm-start from Exp 4. Train ONLY on stages 4-8 to develop
# skills the base policy almost never sees from stage-1 starts.
# Agent starting at stage 4 in training sees it in 100% of episodes
# vs. ~5% when training from stage 1. 20x more stage-4+ practice.
#
# This checkpoint will be MERGED with Exp 4's base policy before Exp 5.

total_timesteps: 2000000    # Short — just enough to specialise, not forget stage 1
max_episode_steps: 10000

# Same hyperparameters as Exp 4 but lower LR — specialising, not reinventing
learning_rate: 0.00005      # Low — preserve learned representations, only refine
learning_rate_end: 0.000005
anneal_lr: true
gamma: 0.99
gae_lambda: 0.98
clip_epsilon: 0.2
value_coef: 0.10
entropy_coef: 0.001         # Low — policy already mature, just specialise
entropy_coef_end: 0.0001
anneal_entropy: true
max_grad_norm: 0.5
normalize_returns: true     # Enable return normalization for stable value learning

rollout_steps: 4096
num_epochs: 8
batch_size: 64

hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true
shared_backbone: false

normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 10

# Reward — same as Exp 4
reward_crash_penalty: 400.0
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_speed_scale: 0.1
reward_fuel_bonus: 45.0
reward_pothole_penalty: 8.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08

randomize_seed: true
seed_range: 1000

# HIGH-STAGE ONLY — agent trains exclusively on stages 4-8
stage_mix:
  4: 0.30
  5: 0.30
  6: 0.20
  7: 0.12
  8: 0.08

curriculum_enabled: false
early_stopping_patience: 0

# Eval from high stages to measure specialist progress
eval_interval_updates: 25
eval_episodes: 10
eval_start_stages:
  - 4
  - 6
  - 8
eval_deterministic: true
eval_max_episode_steps: 10000

log_interval: 1
save_interval: 10
checkpoint_dir: rl/ppo/specialist_checkpoints

env_fps: 60
device: cpu
