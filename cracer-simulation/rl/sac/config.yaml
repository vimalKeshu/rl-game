# SAC Training Configuration — Experiment 5
#
# Root cause of all previous failures: curriculum started episodes at stages 4-6,
# training distribution drifted away from stage 1, generalization collapsed.
#
# Fix: disable curriculum entirely. Every episode starts at stage 1.
# The agent can only improve in training by ACTUALLY CLEARING stages.
# training mean_stage = eval mean_stage — no more lying metrics.
#
# Warm-start: load policy weights from Exp 4 best_eval.pt so the agent already
# knows basic navigation. Q-networks reset fresh to recalibrate under new distribution.

# Training duration
total_timesteps: 3000000
max_episode_steps: 10000

# SAC Hyperparameters — same as Exp 4 (validated)
learning_rate: 0.0003
gamma: 0.99
tau: 0.005
alpha: 0.2
auto_alpha: true
target_entropy_ratio: 0.25  # Validated in Exp 4 — alpha converges to ~0.52
min_alpha: 0.05
grad_clip: 1.0

# Training — same as Exp 4
buffer_size: 500000
batch_size: 256
learning_starts: 5000   # Lower than before — policy already warm-started, learns faster
train_freq: 1
gradient_steps: 2

# Network — same as Exp 4
hidden_sizes:
  - 512
  - 512
  - 512
  - 256
use_layer_norm: true

# Observation normalization
normalize_obs: true
obs_clip: 10.0
frame_stack: 4
max_objects: 10

# Reward shaping — same as Exp 4 (crash_penalty=300 validated)
reward_crash_penalty: 300.0
reward_survival_bonus: 0.2
reward_distance_scale: 0.2
reward_stage_bonus: 500.0
reward_speed_scale: 0.1
reward_fuel_bonus: 30.0
reward_pothole_penalty: 5.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08

# Generalization
randomize_seed: true
seed_range: 1000

# Curriculum — DISABLED. Always start from stage 1.
# This aligns training distribution with eval distribution.
# Agent must earn its way to higher stages by actually clearing them.
curriculum_enabled: false

# Logging
log_interval: 1000
save_interval: 10000
checkpoint_dir: rl/sac/checkpoints

# Evaluation — same as Exp 4
eval_episodes: 10
eval_start_stages:
  - 1
  - 3
  - 5
eval_deterministic: true

# Early stopping — disabled
early_stopping_patience: 0

# Environment
env_fps: 60
device: cpu
