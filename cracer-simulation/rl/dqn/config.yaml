# DQN Training Configuration for Cracer Sim
# Aligned with SAC reference implementation (v3)
# Key fixes: obs normalization (replaces broken reward normalization),
# CurriculumManager, centralized shape_reward, evaluate()

# Training duration
total_episodes: 5000
max_steps_per_episode: 10000

# Replay buffer
memory_size: 200000
batch_size: 64
min_replay_size: 5000

# DQN hyperparameters
gamma: 0.99
learning_rate: 0.0001
lr_decay: 1.0
lr_min: 0.000001

# Exploration
eps_start: 1.0
eps_end: 0.05
eps_decay: 50000.0

# Target network
tau: 0.005
target_update_freq: 1

# Network architecture
hidden_sizes:
  - 512
  - 512
  - 256
use_dueling: true
use_double: true
use_layer_norm: true

# Prioritized Experience Replay
use_per: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_episodes: 4000
per_epsilon: 0.000001

# Observation normalization (replaces reward normalization)
normalize_obs: true
obs_clip: 10.0

# Reward shaping — aligned with SAC Exp 1b config
reward_speed_scale: 0.1
reward_fuel_bonus: 30.0
reward_crash_penalty: 75.0
reward_pothole_penalty: 5.0
reward_survival_bonus: 0.15
reward_distance_scale: 0.1
reward_stage_bonus: 1000.0
reward_distance_milestone: 40.0
reward_distance_milestone_interval: 300
reward_safe_speed_bonus: 0.08

# DQN-specific: low fuel urgency
low_fuel_penalty_scale: 1.0
low_fuel_threshold: 0.3

# Gradient clipping
grad_clip_norm: 10.0

# Frame stacking for temporal context
frame_stack: 4

# Observation noise — disabled (obs norm is sufficient)
obs_noise_std: 0.0

# Dropout — disabled
dropout_rate: 0.0

# Max objects in observation
max_objects: 10

# Generalization
randomize_seed: true
seed_range: 1000  # 1K seeds — agent sees each ~5 times over 5K episodes

# Curriculum Learning — 10-stage with graduation (mirrors SAC)
curriculum_enabled: true
curriculum_graduation_window: 100
curriculum_min_episodes_per_stage: 150
curriculum_adaptive_eval_interval: 50

# Early stopping (0 = disabled)
early_stopping_patience: 0

# Evaluation — runs after each checkpoint
eval_episodes: 10
eval_deterministic: true

# Visualization
plot_interval: 100
save_plots: true

# Checkpointing
save_every: 100
checkpoint_dir: rl/dqn/checkpoints
log_interval: 10

# Environment
seed: 42
device: cpu  # CPU is 2.2x faster than MPS for this model size
render: false
